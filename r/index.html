<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />

        <title>好きな餃子について</title>

        <link rel="stylesheet" href="dist/reset.css" />
        <link rel="stylesheet" href="dist/reveal.css" />
        <link rel="stylesheet" href="dist/theme/black.css" />

        <!-- Theme used for syntax highlighted code -->
        <link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
    </head>
    <body>
        <div class="reveal">
            <div class="slides">
                <!-- スライド1：タイトル -->
                <section>
                    <h2>好きな餃子について</h2>
                    <p>私のイチオシ餃子とこだわりポイント</p>
                </section>

                <!-- スライド2：一番好きな餃子のタイプ -->
                <section>
                    <h3>一番好きなのは「パリッと焼き餃子」</h3>
                    <ul>
                        <li>皮は外が<b>パリッ</b>、中は<b>もちもち</b></li>
                        <li>一口かじると溢れる肉汁</li>
                        <li>キャベツ多めでジューシー＆さっぱり！</li>
                    </ul>
                </section>

                <!-- スライド3：おすすめの食べ方・タレ -->
                <section>
                    <h3>こだわりの食べ方</h3>
                    <p>タレの黄金比率：</p>
                    <ul>
                        <li><b>酢 7 : 醤油 3</b> ＋ たっぷりのラー油</li>
                        <li>たまには「酢＋コショウ」であっさりと！</li>
                        <li>白ごはんと一緒に駆け込むのが至高の瞬間</li>
                    </ul>
                </section>

                <!-- スライド4：まとめ -->
                <section>
                    <h3>結論</h3>
                    <p>餃子と白ごはんの組み合わせは最強！</p>
                    <p>餃子が食べたいです 🥟</p>
                </section>
            </div>
        </div>

        <script src="dist/reveal.js"></script>
        <script src="dist/plugin/notes.js"></script>
        <script src="dist/plugin/markdown.js"></script>
        <script src="dist/plugin/highlight.js"></script>
        <script>
            Reveal.initialize({
                hash: true,
                plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
            });
        </script>
    </body>
</html>
